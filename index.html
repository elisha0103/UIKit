<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8" %>
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ShopbyPayment</title>

  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    /* overflow: hidden;  ← 정말 필요한 경우에만 사용하세요 */
  </style>

  <!-- 필요하다면 defer 사용(의존성이 있을 경우 로드 순서 유지) -->
  <!-- 외부 SDK들은 한 번만 로드 -->
  <script src="https://shop-api.e-ncp.com/payments/ncp_pay.js" defer></script>
  <script src="https://js.tosspayments.com/v1" defer></script>
  <script src="https://nsp.pay.naver.com/sdk/js/naverpay.min.js" defer></script>
</head>

<body>
  <div id="payment-container" style="width:100%; height:100%;"></div>

  <script>
    // 네이티브로 결과를 통지 (문자열로 일원화)
    function notifyApp(eventName, payloadObj) {
      const payload = typeof payloadObj === 'string' ? payloadObj : JSON.stringify(payloadObj || {});
      try {
        if (window.webkit?.messageHandlers?.[eventName]) {
          window.webkit.messageHandlers[eventName].postMessage(payload);
          return true;
        }
        if (window.Android?.[eventName]) {
          window.Android[eventName](payload);
          return true;
        }
      } catch (e) {
        console.error('notifyApp error:', e);
      }
      console.warn('No native handler found for', eventName);
      return false;
    }

    // 앱이 호출하는 진입점 (전역)
    window.configurePayment = function (clientId, platform, accessToken, paymentData, confirmUrl) {
      try {
        NCPPay.setConfiguration({
          clientId: clientId,
          confirmUrl: confirmUrl,
          platform: platform,
          accessToken: accessToken
        });
      } catch (e) {
        console.error('NCPPay.setConfiguration failed:', e);
        notifyApp('paymentComplete', { success: false, error: 'CONFIG_ERROR', detail: String(e) });
        return;
      }

      let obj;
      try {
        obj = typeof paymentData === 'string' ? JSON.parse(paymentData) : paymentData;
      } catch (e) {
        console.error('Invalid paymentData JSON:', e);
        notifyApp('paymentComplete', { success: false, error: 'INVALID_PAYMENT_DATA', detail: String(e) });
        return;
      }

      try {
        NCPPay.reservation(
          obj,
          function onSuccess(response) {
            notifyApp('paymentComplete', { success: true, response });
          },
          function onError(error) {
            // NCPPay가 에러 콜백을 제공한다면 이렇게 처리
            notifyApp('paymentComplete', { success: false, error });
          }
        );
      } catch (e) {
        console.error('NCPPay.reservation threw:', e);
        notifyApp('paymentComplete', { success: false, error: 'RESERVATION_ERROR', detail: String(e) });
      }
    };
  </script>
</body>
</html>
