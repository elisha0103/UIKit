<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8" %>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ShopbyPayment</title>

    <!-- 외부 SDK 단 한 번만 포함 -->
    <script src="https://shop-api.e-ncp.com/payments/ncp_pay.js"></script> <!-- ncp_pay -->
    <script src="https://js.tosspayments.com/v1"></script> <!-- 토스 -->
    <script src="https://nsp.pay.naver.com/sdk/js/naverpay.min.js"></script> <!-- 네이버 -->

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="payment-container" style="width: 100%; height: 100%;"></div>

<script>
    // Function to receive payment configuration from the app
    function configurePayment(clientId, platform, accessToken, paymentData, confirmUrl) {
        NCPPay.setConfiguration({
            'clientId': clientId,
            'confirmUrl': confirmUrl,
            'platform': platform,
            'accessToken': accessToken
        });

        const obj = JSON.parse(paymentData);
        NCPPay.reservation(obj, function (response) {
            // Notify the app that payment is complete
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.paymentComplete) {
                window.webkit.messageHandlers.paymentComplete.postMessage(response);
            } else if (window.Android && window.Android.paymentComplete) {
                window.Android.paymentComplete(JSON.stringify(response));
            }
        });
    }
</script>
</body>
</html>
