<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="description" content="">
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <script src="https://pgweb.tosspayments.com/WEB_SERVER/js/receipt_link.js"></script>
  <title>결제 영수증</title>
  <style>
    * {
        margin: 0;
        padding: 0;
      }
    
     html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>

</head>
<body>
<script>
  // 팝업 차단 우회: 새창 대신 현재 창으로 이동
  (function() {
    var originalOpen = window.open;
    window.open = function(url) {
      if (url) { location.href = url; return window; }
      return originalOpen.apply(this, arguments);
    };
  })();

  (function() {
    const sp = new URL(location.href).searchParams;
    const mid         = sp.get('mid');        // LGD_MID
    const oid         = sp.get('oid');        // LGD_OID
    const seqno       = sp.get('seqno') || ''; // 가상계좌면 001 같은 3자리, 아니면 공백
    const tradeType   = sp.get('tradeType') || ''; // BANK | CAS | CR
    const serviceType = sp.get('serviceType') || 'service'; // service | test

    // 문서 로드 즉시 현금영수증 열기
    showCashReceipts(mid, oid, seqno, tradeType, serviceType);
  })();
</script>
</body>
</html>
