<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8" %>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ShopbyPayment</title>

    <!-- 외부 SDK 단 한 번만 포함 -->
    <script src="https://shop-api.e-ncp.com/payments/ncp_pay.js"></script>
    <script type="text/javascript" src="https://pay.kcp.co.kr/plugin/payplus_web.jsp"></script>
    <script type="text/javascript" src="https://nsp.pay.naver.com/sdk/js/naverpay.min.js"></script>
    <script type="text/javascript" src="https://js.tosspayments.com/v1"></script>
    <script language="javascript" type="text/javascript" src="https://chai.finance/js/v1/payment.min.js"></script>
    <!-- service일 경우 아래 URL을 사용  -->
    <script language="javascript" src="https://xpayvvip.uplus.co.kr/xpay/js/xpay_crossplatform.js" type="text/javascript"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="payment-container" style="width: 100%; height: 100%;"></div>

<script>
    window.configurePayment = function(clientId, platform, accessToken, paymentData, confirmUrl) {
        NCPPay.setConfiguration({
            'clientId': clientId,
            'confirmUrl': confirmUrl,
            'platform': platform,
            'accessToken': accessToken
        });

        const obj = JSON.parse(paymentData);
        NCPPay.reservation(obj, function (response) {
            if (window.webkit?.messageHandlers?.paymentComplete) {
                window.webkit.messageHandlers.paymentComplete.postMessage(response);
            } else if (window.Android?.paymentComplete) {
                window.Android.paymentComplete(JSON.stringify(response));
            }
        });
    };
</script>
</body>
</html>
